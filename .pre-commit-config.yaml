repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.71
    hooks:
      - id: ty

  - repo: local
    hooks:
      - id: zensical-build
        name: zensical build
        entry: uv run zensical build
        language: system
        pass_filenames: false
        files: ^(docs/|zensical\.toml|pyproject\.toml|README\.md)
